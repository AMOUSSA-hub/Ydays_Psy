# Lance une base PostgreSQL prête à l'emploi pour le développement.
# Usage : docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: ochitsu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ochitsu
      POSTGRES_PASSWORD: ochitsu
      POSTGRES_DB: ochitsu
    ports:
      - '5432:5432'
    volumes:
      - ochitsu_pgdata:/var/lib/postgresql/data

volumes:
  ochitsu_pgdata:
